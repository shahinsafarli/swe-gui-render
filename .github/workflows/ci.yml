name: CI

on: [pull_request]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: No TODO/FIXME in src/
        run: |
          if grep -rn --include="*.py" -E "TODO|FIXME" src/; then
            echo "ERROR: TODO or FIXME markers found in src/ — resolve them before merging."
            exit 1
          fi

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Type check (mypy)
        run: mypy src/ --ignore-missing-imports

      - name: Run tests with coverage
        run: pytest --cov=src --cov-fail-under=60 --cov-report=term-missing -v

      - name: Smoke tests (provided — must not break)
        run: pytest tests/test_ai_smoke.py -v

      - name: Docker build
        run: docker build --platform linux/amd64 -t researcher .
